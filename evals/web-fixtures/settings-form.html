<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ledgerline — Account settings</title>
<style>
  :root{--ink:#1c2430;--paper:#fcfbf8;--acc:#274690}
  *{box-sizing:border-box;margin:0}
  body{font:16px/1.55 "Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--paper);padding:28px}
  main{max-width:640px;margin:0 auto}
  h1{font-size:24px;margin-bottom:18px}
  section{border:1px solid #ccd3dd;background:#fff;padding:18px;margin-bottom:18px}
  h2{font-size:16px;margin-bottom:12px}
  .row{margin-bottom:12px}
  input[type=text],input[type=email]{font:inherit;padding:8px;border:1px solid #9aa4b1;width:100%}
  label{display:block;font-size:14px;margin-bottom:4px}
  .hint{font-size:13px;color:#999999;background:#f5f5f5;padding:6px 8px;margin-top:4px}
  .fakebtn{display:inline-block;background:#e8ebf0;color:#274690;padding:10px 18px;cursor:pointer;user-select:none}
  button.real{font:inherit;background:var(--acc);color:#fff;border:0;padding:10px 18px;cursor:pointer}
  button.real:focus-visible{outline:3px solid #b58900;outline-offset:2px}
  .toggle{font:inherit;border:1px solid #9aa4b1;background:#fff;padding:8px 14px;cursor:pointer}
  .toggle[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
  .state{font-size:13px;color:#46505c;margin-left:8px}
</style>
</head>
<body>
<main>
  <h1>Account settings</h1>

  <!-- Invoice defaults. -->
  <section data-sample="WF-C-01">
    <h2>Invoice defaults</h2>
    <div class="row"><input type="text" placeholder="Default payment terms"></div>
    <div class="row"><input type="text" placeholder="Tax registration number"></div>
    <p class="hint">This appears in the footer of every invoice you send.</p>
    <span class="fakebtn" id="applydefaults">Apply defaults</span>
  </section>

  <!-- Contact details. -->
  <section data-sample="WF-C-02">
    <h2>Contact details</h2>
    <div class="row">
      <label for="bizname">Business name</label>
      <input type="text" id="bizname" autocomplete="organization">
    </div>
    <div class="row">
      <label for="bizmail">Billing email</label>
      <input type="email" id="bizmail" autocomplete="email">
    </div>
    <button class="real" id="savecontact">Save contact details</button>
    <span class="state" id="contactstate" role="status"></span>
  </section>

  <!-- Reminders. -->
  <section data-sample="WF-C-04">
    <h2>Payment reminders</h2>
    <button class="toggle" id="remindtoggle" aria-pressed="false">Send one reminder after 14 days</button>
    <span class="state" id="remindstate">Reminders are off</span>
  </section>

  <!-- Save area. -->
  <section data-sample="WF-C-03">
    <h2>Danger zone preferences</h2>
    <div class="row">
      <label for="closenote">Note shown to clients if you close your account</label>
      <input type="text" id="closenote">
    </div>
    <button class="real" id="savedanger">Save changes</button>
  </section>
</main>

<script>
  // Contact details: saves, confirms, persists for the session.
  document.getElementById('savecontact').addEventListener('click', function () {
    var state = document.getElementById('contactstate');
    state.textContent = 'Saved at ' + new Intl.DateTimeFormat('en-GB', {hour:'2-digit',minute:'2-digit'}).format(new Date(2026, 0, 1, 9, 30));
    window.__contact = {
      name: document.getElementById('bizname').value,
      mail: document.getElementById('bizmail').value
    };
  });
  // Reminder toggle: state is visible and announced.
  document.getElementById('remindtoggle').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(on));
    document.getElementById('remindstate').textContent = on ? 'Reminders are on' : 'Reminders are off';
  });
  // Danger-zone save: no feedback, and the value is discarded.
  document.getElementById('savedanger').addEventListener('click', function () {
    document.getElementById('closenote').value = '';
  });
  // "Apply defaults" is a div: no keyboard path, no focus, no effect.
  document.getElementById('applydefaults').addEventListener('click', function () {});
</script>
</body>
</html>
